name: Hybrid Fusion Offline Audit
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fusion_offline_audit.yml
      - langtalks/strict_occurrence.py
      - langtalks/fusion_safe.py
      - langtalks/hybrid.py
      - tests/test_langtalks_hybrid_v2.py
      - langtalks/fusion_audit_eval.py
      - tests/test_langtalks_fusion_quality_gate.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    name: Offline tests and cached replay
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Focused regression suite
        run: python -m pytest -q tests/test_langtalks_hybrid.py tests/test_langtalks_hybrid_v2.py tests/test_langtalks_strict_occurrence.py tests/test_langtalks_scoring.py
      - name: Cached Episode 71 comparison
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from langtalks.fusion_audit_eval import replay, assert_no_development_regression
          result, merged = replay(include_merged=True)
          assert_no_development_regression(result)
          out = Path("fusion-results")
          out.mkdir(exist_ok=True)
          (out / "episode71-comparison.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (out / "episode71-revised-hybrid.json").write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          for label in ["baseline_ivrit", "baseline_soniox", "previous_hybrid", "revised_hybrid"]:
              obj = result[label]
              print("METRICS", label, json.dumps({
                  key: obj[key] for key in [
                      "overall_legacy_weighted_score",
                      "unique_term_recall",
                      "timed_occurrence_diagnostic",
                      "one_to_one_timed_occurrence_diagnostic",
                      "hebrew_character_accuracy",
                      "script_density_fidelity",
                      "word_error_rate",
                      "character_error_rate",
                      "known_loanword_recall",
                      "extra_latin_tokens_for_manual_review"
                  ]
              }, ensure_ascii=False))
          print("MODIFICATION_COUNT", result["modification_count"])
          print("MODIFICATIONS", json.dumps(result["changes"], ensure_ascii=False))
          PY
      - name: Upload offline comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode71-hybrid-fusion-replay
          path: fusion-results/
          if-no-files-found: ignore
          retention-days: 30
