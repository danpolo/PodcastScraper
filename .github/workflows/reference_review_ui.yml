name: Timestamp review UI smoke test
on:
  push:
    branches: [dev]
    paths:
      - tools/reference-review.html
      - tools/tests/reference_review_smoke.py
      - .github/workflows/reference_review_ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.49.1
      - run: playwright install chromium --with-deps
      - name: Test offline browser reviewer
        run: python tools/tests/reference_review_smoke.py
